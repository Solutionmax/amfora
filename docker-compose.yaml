services:
  amfora:
    # The published image. To run your own build instead:
    #   make build TAG=local && AMFORA_IMAGE=amfora:local docker compose up -d
    image: ${AMFORA_IMAGE:-ghcr.io/solutionmax/amfora:2.0.1}
    # Over the air updates are optional and need a one time install on the host:
    #   sudo COMPOSE_DIR=/opt/amfora bash ota/install-ota.sh
    # then uncomment the ota-state mount under volumes. See docs/OTA.md.
    #   AMFORA_UPDATE_URL: ""   # empty switches update checking off entirely
    container_name: amfora
    environment:
      # ==============================================================================
      # STORAGE
      # ==============================================================================
      # Internal storage needs no configuration. Files are managed for you.
      #
      # To use external S3 storage (AWS, Wasabi, Backblaze, R2, MinIO elsewhere):
      # - ENABLE_S3=true
      # - S3_ENDPOINT=s3.amazonaws.com
      # - S3_ACCESS_KEY=your-access-key
      # - S3_SECRET_KEY=your-secret-key
      # - S3_BUCKET_NAME=amfora-files
      # - S3_REGION=us-east-1
      # - S3_USE_SSL=true
      # - S3_FORCE_PATH_STYLE=false      # true for MinIO
      # - S3_REJECT_UNAUTHORIZED=true
      # - S3_DISABLE_CHECKSUMS=true      # required for Cloudflare R2
      #
      # ==============================================================================
      # USER AND GROUP
      # ==============================================================================
      # - AMFORA_UID=1000
      # - AMFORA_GID=1000
      #
      # ==============================================================================
      # APPLICATION
      # ==============================================================================
      # - DEFAULT_LANGUAGE=en-US
      # - PRESIGNED_URL_EXPIRATION=3600
      # - SECURE_SITE=true               # set when behind an HTTPS reverse proxy
      # - CORS_ORIGINS=https://app.example.com   # only if a browser calls the API directly
      #
      # Required for internal storage: the URL the browser uses to reach storage.
      APP_URL: "http://localhost:5487" # replace with your actual HTTPS app origin in production
      STORAGE_URL: "http://127.0.0.1:9379"
    ports:
      - "5487:5487" # Web interface
      - "9379:9379" # Internal storage, the browser uploads and downloads here directly
      # The API on 3333 is reached from inside the container. Publish it only if you
      # actually call the API from outside, and put it behind authentication if you do.
      # - "3333:3333"
    volumes:
      - amfora_data:/app/server
      # To keep files on a different disk, mount it here instead:
      # - /mnt/storage/amfora-files:/app/server/minio-data
    restart: unless-stopped
    # The image ships a health check; this makes it visible to compose as well.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5487"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # A runaway process should not be able to take the whole host with it.
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

volumes:
  amfora_data:
