name: CI

on:
  push:
    branches: [main, amfora]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile uses heredoc COPY, so it only builds with buildx.
      # Build only: publishing happens from a tag, not from every push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: amfora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A fresh install exactly as the installer writes it: no AMFORA_UID, empty volume.
      # 2.0.0 failed here (server ran as uid 1000 and could not read the storage credentials).
      - name: Fresh start smoke test
        run: |
          docker run -d --name smoke -p 5487:5487 -p 9379:9379 \
            -e APP_URL=http://localhost:5487 -e STORAGE_URL=http://127.0.0.1:9379 amfora:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:5487/; then ok=1; break; fi
            sleep 5
          done
          docker logs smoke > smoke.log 2>&1 || true
          if grep -q EACCES smoke.log; then grep EACCES smoke.log | head; echo "::error::permission errors on a fresh start"; exit 1; fi
          [ "${ok:-}" = 1 ] || { tail -60 smoke.log; echo "::error::no answer on 5487 after 5 minutes"; exit 1; }
          echo "fresh start answers on 5487"

  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LICENSE, NOTICE, README and the vendor stage are allowed to name the upstream
      # project. Nothing else may, and no competitor brand may appear anywhere.
      - name: No stray brand references
        run: |
          if grep -rniE 'palmr|kyantech|wetransfer' . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude-dir=superpowers \
              --exclude=pnpm-lock.yaml --exclude=LICENSE --exclude=NOTICE \
              --exclude=README.md --exclude=Dockerfile --exclude=ci.yml \
              --exclude=minio-setup.sh --exclude=server-start.sh \
              | grep -vE '^\./site/palmr/|/palmr/|RELEASE-2\.0\.1\.md'; then
            echo "::error::Found a brand reference that should not be there"
            exit 1
          fi
          echo "Clean."
      - name: Installer control flow
        run: |
          sh -n site/get
          python3 tests/test-installer.py
